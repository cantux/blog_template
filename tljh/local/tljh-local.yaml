# TLJH in a local Lima VM — mirrors the EC2 runbook in ../README.md (minus TLS/OAuth/DNS).
# Run: limactl start --name=tljh ./tljh-local.yaml
# Hub: http://localhost:12000 — login `admin` + any password (first login sets it)
images:
  - location: "https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: "aarch64"
  - location: "https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-amd64.img"
    arch: "x86_64"
cpus: 2
memory: "4GiB"
disk: "20GiB"
provision:
  - mode: system
    script: |
      #!/bin/bash
      set -euo pipefail
      if [ ! -d /opt/tljh ]; then
        curl -L https://tljh.jupyter.org/bootstrap.py | python3 - --admin admin
      fi
portForwards:
  - guestPort: 80
    hostPort: 12000
probes:
  - description: "TLJH hub is up"
    script: |
      #!/bin/bash
      set -eu
      if ! timeout 600s bash -c "until curl -fsS http://localhost:80/hub/api >/dev/null 2>&1; do sleep 5; done"; then
        echo >&2 "hub not up yet — check: limactl shell tljh sudo tail -f /opt/tljh/installer.log"
        exit 1
      fi
