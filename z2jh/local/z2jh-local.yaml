# Lima VM: k3s cluster for z2jh, local-first. Started by ./up.sh (which also helm-installs the chart).
# nestedVirtualization gives the VM a real /dev/kvm (M3+/macOS 15+) — enables Kata/Firecracker sandbox work later.
vmType: vz
nestedVirtualization: true
images:
  - location: "https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: "aarch64"
  - location: "https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-amd64.img"
    arch: "x86_64"
cpus: 3
memory: "6GiB"
disk: "30GiB"
mounts:
  - location: "~"
provision:
  - mode: system
    script: |
      #!/bin/bash
      set -euo pipefail
      if ! command -v k3s >/dev/null; then
        # k3s bundled traefik disabled so z2jh's proxy-public LoadBalancer gets port 80
        curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="--disable traefik" sh -
      fi
      if ! command -v helm >/dev/null; then
        curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      fi
portForwards:
  - guestPort: 80
    hostPort: 12080
probes:
  - description: "k3s node is Ready"
    script: |
      #!/bin/bash
      set -eu
      if ! timeout 300s bash -c "until sudo k3s kubectl get node 2>/dev/null | grep -q ' Ready'; do sleep 3; done"; then
        echo >&2 "k3s not ready — check: limactl shell z2jh sudo journalctl -u k3s"
        exit 1
      fi
